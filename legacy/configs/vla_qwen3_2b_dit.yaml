backbone:
  repo_id: Qwen/Qwen3-VL-2B-Instruct
  dtype: bfloat16
  freeze_backbone: false
  freeze_vision: true
  gradient_checkpointing: false
  max_pixels: 25088
  min_pixels: 6272
  n_goal_tokens: 4
  prompt: Describe the camera framing of the subject.
  goal_conditioning: text
expert:
  type: dit
  dim: 1024
  depth: 12
  heads: 16
data:
  annotation_roots:
  - data/trajectories_full
  chunk_size: 8
  stride: 1
  sampling_scheme: goal_start
  goal_start_max_per_pair: 24
  goal_start_seed: 0
  cache_dir: /home/nas5/jooyeolyun/datasets/drone_data/.index_cache
  max_samples: null
  target_resolution:
  - 480
  - 720
  goal_score_keys:
  - occupancy
  - body_in_frame_ratio
  - subject_bearing_deg
  - cam_to_obj_elevation_deg
  - object_center_x
  - object_center_y
  - bbox_x_offset
  - bbox_y_offset
  val_split_level: scene
  val_names: configs/policy/val_scenes.json
  val_stride: 4
  val_max_samples: 24
  val_iter: 2000
  val_sample_steps: 0
flow:
  p_mean: 0.0
  p_std: 1.0
  use_balanced_two_heads: true
  high_sigma_ratio: 0.25
  low_sigma_ratio: 0.25
trainer:
  output_root: runs
  run_name: vla_qwen3_2b_dit
  max_iter: 50000
  early_stop_patience: 10
  batch_size: 4
  grad_accum: 2
  learning_rate: 1.0e-05
  weight_decay: 0.0
  warmup_iter: 1000
  save_iter: 2000
  log_iter: 100
  seed: 0
  device: cuda
  dtype: bfloat16
dataloader:
  num_workers: 8
  pin_memory: true
  shuffle: true
  drop_last: true
