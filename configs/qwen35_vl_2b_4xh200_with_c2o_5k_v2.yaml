model:
  name_or_path: Qwen/Qwen3.5-2B
  dtype: bfloat16
  attn_implementation: null
  trust_remote_code: true

data:
  annotations_path: outputs/Namaqualand_namaqualand_v3_260401_024633/annotations_5k.json
  image_root: outputs/Namaqualand_namaqualand_v3_260401_024633
  action_frame: camera_local
  rotation_representation: orientation_6d
  target_score_keys:
    - bbox_occupancy_ratio
    - bbox_margin_top
    - bbox_margin_bottom
    - bbox_margin_left
    - bbox_margin_right
    - bbox_aspect_ratio
    - bbox_centroid_offset
    - body_in_frame_ratio
    - camera_to_object_fx
    - camera_to_object_fy
    - camera_to_object_fz
    - camera_to_object_ux
    - camera_to_object_uy
    - camera_to_object_uz
  distance_threshold: 3.0
  max_pairs_per_image: 64
  zero_action_ratio: 0.1
  eval_ratio: 0.05
  seed: 721

training:
  output_root: runs
  run_name: qwen35_vl_2b_4xh200_with_c2o_5k_v2
  num_train_epochs: 3
  per_device_train_batch_size: 8
  per_device_eval_batch_size: 4
  gradient_accumulation_steps: 2
  learning_rate: 2.0e-5
  weight_decay: 0.01
  warmup_ratio: 0.03
  max_length: 2048
  logging_steps: 10
  save_steps: 1000
  eval_steps: 1000
  dataloader_num_workers: 8
  gradient_checkpointing: true
  bf16: true
  fp16: false
  deepspeed_config: configs/deepspeed_zero3.json
  resume_from_checkpoint: null
  regression_weight: 0.5
