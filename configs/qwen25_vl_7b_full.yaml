model:
  name_or_path: Qwen/Qwen2.5-VL-7B-Instruct
  torch_dtype: bfloat16
  attn_implementation: flash_attention_2

data:
  annotations_path: outputs/DogWalk_260215_092109/annotations.json
  image_root: outputs/DogWalk_260215_092109
  distance_threshold: 1.5
  max_pairs_per_image: 32
  eval_ratio: 0.02
  seed: 721

training:
  output_root: runs
  run_name: qwen25_vl_7b_full
  num_train_epochs: 1
  per_device_train_batch_size: 1
  per_device_eval_batch_size: 1
  gradient_accumulation_steps: 16
  learning_rate: 2.0e-5
  weight_decay: 0.01
  warmup_ratio: 0.03
  max_length: 2048
  logging_steps: 10
  save_steps: 100
  eval_steps: 100
  dataloader_num_workers: 4
  gradient_checkpointing: true
  bf16: true
  fp16: false
  deepspeed_config: configs/deepspeed_zero3.json
  resume_from_checkpoint: null
