# AutoPhoto baseline (issue #22): RL with an aesthetic reward, trained in Blender.
# Reuses AutoPhoto's pretrained scorer as the reward; the RecurrentPPO policy is
# trained from scratch in PhotoEnv. Goal-agnostic. Runs on the render machine.

reward:
  checkpoint: weights/autophoto/resnet-model42.pt   # gitignored; fetch from the AutoPhoto repo
  device: cuda

data:
  # YAML manifest of v7 placement data.json paths to TRAIN on — every scored
  # placement whose SCENE is NOT in the V12 scene-level val (configs/policy/
  # val_scenes.json, 8 held-out scenes). Regenerate with
  # `python scripts/make_autophoto_train_placements.py` when the val split changes.
  placements: configs/policy/autophoto_train_placements.yaml
  vlm_placements_dir: data/vlm_object_placing_v6_260428_061326   # holds scene_scale + object transform

renderer:
  # cycles_gpu: EEVEE ignores CUDA_VISIBLE_DEVICES and always renders on physical
  # GPU 0 (forbidden). Cycles+OptiX honors the pin, so we use it to keep renders
  # on the assigned GPU. ~3x slower per frame than EEVEE, but correct.
  cycles_gpu: true
  samples: 8              # fewer Cycles samples -> faster renders (RL doesn't need clean)
  timeout_s: 300         # Cycles BVH build on heavy scenes can exceed the 90s EEVEE default

train:
  output_dir: runs/autophoto
  total_timesteps: 100000        # reduced scale (AutoPhoto used 1.5M in fast Habitat)
  max_steps: 100                 # episode horizon (AutoPhoto: 100)
  scene_change_freq: 5           # swap scene every N episodes
  n_steps: 256                   # per env per PPO update
  n_envs: 4                      # parallel Blender workers (SubprocVecEnv), Cycles/OptiX.
  env_gpus: [7]                 # share GPU 7 with the DP retrain (all Cycles+OptiX renders +
                                 # per-env reward models pinned to physical GPU 7). Launch the
                                 # process with CUDA_VISIBLE_DEVICES=7 so the PPO policy + main
                                 # reward model also stay on 7 (never the forbidden GPU 0).
  save_freq: 2000                # checkpoint cadence in TOTAL env steps
  learning_rate: 3.0e-4
