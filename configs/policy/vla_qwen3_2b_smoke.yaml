# π0-style VLA ablation baseline (issue #22): "ours without the world model".
# Same v7 data / goal space / 5D action / flow convention / eval as the Cosmos
# policy — only the world model is removed (VLM predicts the action directly).

backbone:
  repo_id: Qwen/Qwen3-VL-2B-Instruct
  dtype: bfloat16
  freeze_backbone: false        # full finetune, matching our Cosmos run
  gradient_checkpointing: true
  n_goal_tokens: 4
  prompt: "Describe the camera framing of the subject."

expert:
  dim: 512
  depth: 6
  heads: 8

data:
  annotation_roots:
    - data/trajectories_full
  chunk_size: 8
  stride: 1
  max_samples: 512
  target_resolution: [224, 336]
  goal_score_keys:
    - occupancy
    - body_in_frame_ratio
    - cam_to_obj_azimuth_deg
    - cam_to_obj_elevation_deg
    - object_center_x
    - object_center_y
    - bbox_x_offset
    - bbox_y_offset

  # Held-out val: same scene-level manifest as the Cosmos policy.
  val_split_level: scene
  val_names: configs/policy/val_scenes.yaml
  val_stride: 4
  val_max_samples: 64
  val_iter: 60
  val_sample_steps: 10

flow:
  p_mean: 0.0
  p_std: 1.0
  use_balanced_two_heads: true
  high_sigma_ratio: 0.25
  low_sigma_ratio: 0.25

trainer:
  output_root: runs
  run_name: vla_qwen3_2b_smoke
  max_iter: 200
  batch_size: 1
  grad_accum: 8
  learning_rate: 1.0e-5
  weight_decay: 0.0
  warmup_iter: 20
  save_iter: 100
  log_iter: 20
  seed: 0
  device: cuda
  dtype: bfloat16

dataloader:
  num_workers: 2
  pin_memory: true
  shuffle: true
  drop_last: true
