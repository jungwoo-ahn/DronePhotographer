# Diffusion Policy ablation baseline (issue #22): "ours without the world model".
# Frozen DINOv2-large encoder + conditional 1D U-Net DDPM action head. Same v7
# data / goal space / 5D action / held-out val / eval as the Cosmos policy — the
# world model is removed and the backbone is a frozen vision encoder (no VLM).

backbone:
  repo_id: facebook/dinov2-large
  dtype: bfloat16
  freeze_backbone: true         # canonical Diffusion Policy: frozen pretrained encoder

model:
  goal_embed_dim: 128
  down_dims: [128, 256, 512]
  diffusion_step_embed_dim: 128
  num_train_timesteps: 100
  beta_schedule: squaredcos_cap_v2

data:
  annotation_roots:
    - data/trajectories_full     # symlink -> full v7 set (same as cosmos/vla)
  chunk_size: 8
  stride: 1
  # V12 goal-start windows: a well-framed goal + a start delta 0-32 away, the chunk
  # walks toward it one frame at a time and CLAMPS at the goal (arrival -> zero pose
  # action + shoot=1). near/far stratified per pair. Gives goal-dependence AND the
  # meaningful shoot channel, and fixes the overshoot the old endpoint scheme caused.
  sampling_scheme: goal_start
  goal_start_max_per_pair: 24        # kept windows per pair (25% near, 75% far)
  goal_start_seed: 0
  # Disk cache for the built window index (keyed on all index params + each
  # annotation file's size/mtime, so reruns / DDP ranks load in seconds; a changed
  # action rep / sampler busts it via _INDEX_CACHE_VERSION). Shared across baselines.
  cache_dir: /home/nas5/jooyeolyun/datasets/drone_data/.index_cache
  max_samples: null
  target_resolution: [480, 720]  # DINOv2 processor re-crops to its own size
  goal_score_keys:
    - occupancy
    - body_in_frame_ratio
    - cam_to_obj_azimuth_deg
    - cam_to_obj_elevation_deg
    - object_center_x
    - object_center_y
    - bbox_x_offset
    - bbox_y_offset

  # Held-out val: jungwoo's V12 scene-level manifest (8 whole scenes, 675 placements).
  # Same file/semantics as V12 so DP is directly comparable to the Cosmos policy.
  val_split_level: scene
  val_names: configs/policy/val_scenes.json
  val_stride: 4
  val_max_samples: 64
  val_iter: 2000           # aligned with save_iter so each save has a fresh val
  val_sample_steps: 0      # LOSS-ONLY validation (no per-step sampler simulation)

trainer:
  output_root: runs
  run_name: diffusion_policy_dinov2
  max_iter: 300000               # ceiling; early stopping ends it sooner
  early_stop_patience: 10        # stop if val loss hasn't improved for 10 vals (20k iters)
  batch_size: 64                 # frozen backbone + tiny head -> large batch fits
  grad_accum: 1
  learning_rate: 1.0e-4
  weight_decay: 1.0e-6
  warmup_iter: 500
  save_iter: 2000
  log_iter: 100
  seed: 0
  device: cuda
  dtype: bfloat16

dataloader:
  num_workers: 8
  pin_memory: true
  shuffle: true
  drop_last: true
