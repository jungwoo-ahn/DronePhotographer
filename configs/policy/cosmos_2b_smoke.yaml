# First-GPU-experiment smoke config: frozen Cosmos-2B, conditioner+heads only,
# real v7 data under data/trajectories. Run on a free GPU:
#   CUDA_VISIBLE_DEVICES=2 PYTHONPATH=. python scripts/train_cosmos_policy.py \
#       --config configs/policy/cosmos_2b_smoke.yaml

backbone:
  repo_id: nvidia/Cosmos-Predict2.5-2B
  revision: diffusers/base/post-trained
  dtype: bfloat16
  freeze_backbone: true
  n_goal_tokens: 4

conditioner:
  # Qwen2.5-VL anchor (scripts/build_text_anchor.py)
  anchor_path: assets/text_anchor.pt

data:
  annotation_roots:
    - data/trajectories
  chunk_size: 8
  stride: 2
  goal_sampling: uniform_future  # HER-"future": goal frame ~ U[end_frame, 31]; "end" = legacy fixed offset
  max_samples: 512
  target_resolution: [480, 720]
  goal_score_keys:
    - occupancy
    - body_in_frame_ratio
    - cam_to_obj_azimuth_deg
    - cam_to_obj_elevation_deg
    - object_center_x
    - object_center_y
    - bbox_x_offset
    - bbox_y_offset

loss:
  lambda_world: 1.0
  lambda_action: 1.0
  lambda_value: 1.0

flow:
  # Flow-matching sigma sampling — matches the 2.5 checkpoint's pretraining
  # (x_t = (1-s)x0 + s*eps, model predicts v = eps - x0, timestep = sigma in [0,1]).
  p_mean: 0.0                  # logit-normal location
  p_std: 1.0
  use_balanced_two_heads: true # force tails: near-noise + near-clean heads
  high_sigma_ratio: 0.25
  low_sigma_ratio: 0.25
  cond_timestep: 0.1           # pipeline's conditional_frame_timestep (sampling)

trainer:
  output_root: runs
  run_name: cosmos_2b_smoke
  max_iter: 200
  batch_size: 1
  grad_accum: 4
  learning_rate: 1.0e-4
  weight_decay: 0.0
  warmup_iter: 20
  save_iter: 100
  log_iter: 10
  seed: 0
  device: cuda
  dtype: bfloat16

dataloader:
  num_workers: 4
  pin_memory: true
  shuffle: true
  drop_last: true
