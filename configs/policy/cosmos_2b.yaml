# Cosmos-Predict2.5-2B goal-conditioned policy on the v7 dataset.
# See docs/v7_handoff_jooyeol.md on branch v7_data_for_cosmos_policy for the data format.

backbone:
  repo_id: nvidia/Cosmos-Predict2.5-2B
  revision: diffusers/base/post-trained
  dtype: bfloat16
  freeze_backbone: false        # full finetune (upstream cosmos-policy does the same)
  gradient_checkpointing: true
  n_goal_tokens: 4

conditioner:
  anchor_path: assets/text_anchor.pt
  # How the goal enters the backbone:
  #   cross_attn — goal -> K prefix tokens in cross-attention (conditional prefix tuning)
  #   adaln      — goal -> zero-init embedding ADDED to the timestep embedding (AdaLN-Zero
  #                scale/shift/gate); cross-attention then carries the anchor text only.
  goal_conditioning: cross_attn
  adaln_hidden_dim: 256          # only used when goal_conditioning: adaln

data:
  # Point at the directory holding all v7 placement subdirs. The dataset
  # recursively finds each placement's data.json. Put (or symlink) the full
  # v7 render output here — e.g.:
  #   ln -s /path/to/outputs/v7_renders/* data/trajectories/
  # Do NOT list the same placements under two roots — that duplicates samples.
  annotation_roots:
    - data/trajectories
  chunk_size: 8                # ALOHA-style: 8 future actions per diffusion sample
  stride: 1                    # sliding window; ~24 samples per accepted_pair (32-frame trajectory)
  goal_sampling: uniform_future  # HER-"future": goal frame ~ U[end_frame, 31]; "end" = legacy fixed offset
  val_split_level: placement         # unseen-scene generalization (pair | placement | scene | object)
  val_names: configs/policy/val_placements_v7.txt   # frozen manifest — pins the val scenes forever;
                                 # new data arrivals always go to train. Overrides the hash split.
  val_pair_stride: 0             # unused while val_names is set (hash-split fallback)
  val_stride: 4                  # window stride within val trajectories
  val_max_samples: 64            # cap val windows so the val pass stays fast (5 sigma evals
                                 # + an 8-step diffusion sample per batch are not cheap)
  max_samples: null            # use the full dataset
  target_resolution: [480, 720]
  goal_score_keys:
    # All 8 V5 keys are present in v7 (Stage 3 scoring fills them).
    - occupancy
    - body_in_frame_ratio
    - cam_to_obj_azimuth_deg
    - cam_to_obj_elevation_deg
    - object_center_x
    - object_center_y
    - bbox_x_offset
    - bbox_y_offset

loss:
  lambda_world: 1.0
  lambda_action: 1.0
  lambda_value: 1.0

flow:
  # Flow-matching sigma sampling — matches the 2.5 checkpoint's pretraining
  # (x_t = (1-s)x0 + s*eps, model predicts v = eps - x0, timestep = sigma in [0,1]).
  p_mean: 0.0                  # logit-normal location
  p_std: 1.0
  use_balanced_two_heads: true # force tails: near-noise + near-clean heads
  high_sigma_ratio: 0.25
  low_sigma_ratio: 0.25
  cond_timestep: 0.1           # pipeline's conditional_frame_timestep (sampling)

trainer:
  output_root: runs
  run_name: cosmos_2b
  max_iter: 50000
  batch_size: 1
  grad_accum: 8
  learning_rate: 1.0e-5         # full-finetune LR (conditioner-only used 1e-4)
  weight_decay: 0.0
  warmup_iter: 1000
  save_iter: 2000
  log_iter: 100
  val_iter: 200                 # fixed-sigma val loss + sampler action MSE / value MAE (rank 0)
  val_sample_steps: 8
  seed: 0
  device: cuda
  dtype: bfloat16

dataloader:
  num_workers: 8
  pin_memory: true
  shuffle: true
  drop_last: true
