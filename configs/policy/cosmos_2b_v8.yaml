# Cosmos-Predict2.5-2B goal-conditioned policy — v8 bundled run.
# Bundles four levers to break the goal->action saturation (see
# .claude/plans/dapper-honking-whale.md and memory/goal-action-collapse-root-cause.md):
#   1. Clamp fix — near-plane dolly-in goals recovered (code: bbox_control + annotations),
#      so the deep multiscale endpoints are valid instead of dropped.
#   2. n_goal_tokens 4 -> 32 — louder, higher-capacity goal conditioning.
#   3. CFG — cfg_dropout_prob trains the unconditional score; sample() supports
#      guidance_scale x {null, flip} negatives at inference.
#   4. Leak-free val — object-disjoint (unseen subjects), placement-level manifest.
# K=32 cannot resume from a K=4 checkpoint: this trains fresh.

backbone:
  repo_id: nvidia/Cosmos-Predict2.5-2B
  revision: diffusers/base/post-trained
  dtype: bfloat16
  freeze_backbone: false        # full finetune
  gradient_checkpointing: false
  n_goal_tokens: 32             # was 4 — goal now ~43% of the cross-attn sequence (43 anchor + 32 goal)

conditioner:
  anchor_path: assets/text_anchor.pt
  goal_conditioning: cross_attn  # cross_attn (prefix tokens) | adaln (AdaLN-Zero into temb)
  adaln_hidden_dim: 256          # only used when goal_conditioning: adaln
  cfg_dropout_prob: 0.1          # classifier-free guidance: zero the goal for 10% of train items
                                 # so the model also learns P(x|no-goal) (the null negative).

data:
  annotation_roots:
    - data/trajectories
  chunk_size: 8
  sampling_scheme: multiscale_bidir
  offsets: [8, 16, 24]
  stride: 1
  goal_sampling: uniform_future
  augment_reverse: false
  value_target_mode: cost_to_go
  filter_clamped_goals: true     # with the clamp fix, recovered close-ups are no longer sentinels,
                                 # so this now only drops genuine subject-absent (bbox None) frames.
  # Leak-free val: object-disjoint (unseen subjects). The manifest lists explicit
  # val placement dirs; val_split_level=placement matches on the full placement name.
  val_split_level: placement     # unseen-subject generalization (manifest of val placements)
  val_names: configs/policy/val_placements_v7.txt   # generated by scripts/make_val_split.py --mode object
  val_pair_stride: 0
  val_stride: 4
  val_max_samples: 64
  max_samples: null
  target_resolution: [480, 720]
  goal_score_keys:
    - occupancy
    - body_in_frame_ratio
    - cam_to_obj_azimuth_deg
    - cam_to_obj_elevation_deg
    - object_center_x
    - object_center_y
    - bbox_x_offset
    - bbox_y_offset

loss:
  lambda_world: 0.1
  lambda_action: 1.0
  lambda_value: 1.0

flow:
  p_mean: 0.0
  p_std: 1.0
  use_balanced_two_heads: true
  high_sigma_ratio: 0.25
  low_sigma_ratio: 0.25
  cond_timestep: 0.1

trainer:
  output_root: runs
  run_name: cosmos_2b_v8         # clamp-fix + 32 goal tokens + CFG-dropout + object-disjoint val
  max_iter: 4000                 # enough to see if the ~21%-of-ceiling saturation breaks
  batch_size: 1
  grad_accum: 8
  learning_rate: 1.0e-5
  weight_decay: 0.0
  warmup_iter: 200
  save_iter: 1000
  log_iter: 100
  val_iter: 500
  val_sample_steps: 8
  viz_iter: 1000                 # dump denoise samples (state | pred-world | gt-world) + metrics
  viz_samples: 4
  viz_steps: 16
  seed: 0
  device: cuda
  dtype: bfloat16

dataloader:
  num_workers: 8
  pin_memory: true
  shuffle: true
  drop_last: true
