# Cosmos-Predict2.5-2B goal-conditioned policy on the v7 dataset.
# See docs/v7_handoff_jooyeol.md on branch v7_data_for_cosmos_policy for the data format.

backbone:
  repo_id: nvidia/Cosmos-Predict2.5-2B
  revision: diffusers/base/post-trained
  dtype: bfloat16
  freeze_backbone: false        # full finetune (upstream cosmos-policy does the same)
  gradient_checkpointing: false # B200: full-finetune measured ~27GB WITH ckpt (179GB card) → ample
                                # headroom, so disable activation recompute for ~25-40% speedup.
                                # Re-enable on <=40GB cards (A6000) where it's required to fit.
  n_goal_tokens: 4

conditioner:
  anchor_path: assets/text_anchor.pt
  # How the goal enters the backbone:
  #   cross_attn — goal -> K prefix tokens in cross-attention (conditional prefix tuning)
  #   adaln      — goal -> zero-init embedding ADDED to the timestep embedding (AdaLN-Zero
  #                scale/shift/gate); cross-attention then carries the anchor text only.
  # EXPERIMENT: adaln-zero showed FLAT goal-dependence over 6k iters (ratio 0.37->0.40) —
  # the zero-init goal->temb path never ramps. Switched to cross_attn (goal -> 4 prefix
  # tokens, full-scale from step 0) to test whether stronger conditioning develops
  # goal-dependent actions. Clean comparison to the adaln+lambda_world=0.1 run (which was flat).
  goal_conditioning: cross_attn  # cross_attn (prefix tokens) | adaln (AdaLN-Zero into temb)
  adaln_hidden_dim: 256          # only used when goal_conditioning: adaln

data:
  # Point at the directory holding all v7 placement subdirs. The dataset
  # recursively finds each placement's data.json. Put (or symlink) the full
  # v7 render output here — e.g.:
  #   ln -s /path/to/outputs/v7_renders/* data/trajectories/
  # Do NOT list the same placements under two roots — that duplicates samples.
  annotation_roots:
    - data/trajectories
  chunk_size: 8                # ALOHA-style: 8 future actions per diffusion sample
  # Sampling scheme — how (state, goal, action_chunk) tuples are drawn:
  #   multiscale_bidir — per start frame, one window per signed offset ±o (o in `offsets`)
  #     whose endpoint exists. The goal IS that endpoint, so the same start with different
  #     endpoints yields different action targets → forces actions to depend on the goal
  #     (fixes actions collapsing to f(state)). Subsumes augment_reverse (negative offsets
  #     give dolly-OUT) and ignores stride/goal_sampling. ~96 windows/pair before filtering.
  #   sliding_window — legacy chunk_size window slid by `stride`, HER goal via goal_sampling.
  sampling_scheme: multiscale_bidir
  offsets: [8, 16, 24]         # multiscale endpoint distances (multiples of chunk_size);
                               # → per-action frame_step 1/2/3 (offset 16/24 merge 2/3 real steps)
  stride: 1                    # sliding_window only (unused under multiscale_bidir)
  goal_sampling: uniform_future  # sliding_window only (unused under multiscale_bidir)
  augment_reverse: false         # subsumed by bidirectional offsets (was true for sliding_window)
  # What the per-step value latent predicts (selectable):
  #   cost_to_go       — scalar −pose_distance(state_k, goal) (geometric, pose-based, clamp-robust)
  #   achieved_profile — the goal_dim shot profile realized at state_k (profile-space world model)
  #   profile_delta    — goal_profile − achieved(state_k), per-key cost-to-go in the goal space
  # profile modes are score-derived (inherit the off-screen clamp on degenerate frames).
  value_target_mode: cost_to_go
  val_split_level: scene         # unseen-scene generalization (pair | placement | scene | object)
  val_names: configs/policy/val_scenes.txt   # frozen manifest — pins the val scenes forever;
                                 # new data arrivals always go to train. Overrides the hash split.
  val_pair_stride: 0             # unused while val_names is set (hash-split fallback)
  val_stride: 4                  # window stride within val trajectories
  val_max_samples: 64            # cap val windows so the val pass stays fast (5 sigma evals
                                 # + an 8-step diffusion sample per batch are not cheap)
  max_samples: null            # use the full dataset
  target_resolution: [480, 720]
  goal_score_keys:
    # All 8 V5 keys are present in v7 (Stage 3 scoring fills them).
    - occupancy
    - body_in_frame_ratio
    - cam_to_obj_azimuth_deg
    - cam_to_obj_elevation_deg
    - object_center_x
    - object_center_y
    - bbox_x_offset
    - bbox_y_offset

loss:
  # world(endpoint-frame) target is ~impossible → its loss stays ~0.27 and DOMINATED the
  # gradient (30:1 vs action), starving the goal→action pathway (diagnosed: weak goal-dep
  # ratio ~0.4 flat at iter 8000). Downweighted 10x so the action/goal objective gets the
  # gradient. If action_mse still doesn't move, go lower (0.03 / 0.0).
  lambda_world: 0.1
  lambda_action: 1.0
  lambda_value: 1.0

flow:
  # Flow-matching sigma sampling — matches the 2.5 checkpoint's pretraining
  # (x_t = (1-s)x0 + s*eps, model predicts v = eps - x0, timestep = sigma in [0,1]).
  p_mean: 0.0                  # logit-normal location
  p_std: 1.0
  use_balanced_two_heads: true # force tails: near-noise + near-clean heads
  high_sigma_ratio: 0.25
  low_sigma_ratio: 0.25
  cond_timestep: 0.1           # pipeline's conditional_frame_timestep (sampling)

trainer:
  output_root: runs
  run_name: cosmos_2b_goalnorm   # cross_attn + RMSNorm goal tokens to anchor scale (goal/anchor 0.0006 -> 1.0)
  max_iter: 8000                 # extended run (resume from the iter-2000 probe); watch the ratio climb
  batch_size: 1
  grad_accum: 8
  learning_rate: 1.0e-5         # full-finetune LR (conditioner-only used 1e-4)
  weight_decay: 0.0
  warmup_iter: 200
  save_iter: 1000                # ckpt_last every 1000 (check_goal_dependence probes the ramp)
  log_iter: 100
  val_iter: 500                  # fixed-sigma val loss + sampler action MSE / value MAE (rank 0)
  val_sample_steps: 8
  # Denoising-sample viz: every N iters dump [state|pred-world|gt-world] grids + action/value
  # pred-vs-GT json to <run>/samples/iter<N>/ (rank 0). Watch the world/action track the goal.
  viz_iter: 1000
  viz_samples: 4
  viz_steps: 16
  seed: 0
  device: cuda
  dtype: bfloat16

dataloader:
  num_workers: 8
  pin_memory: true
  shuffle: true
  drop_last: true
