model:
  name_or_path: Qwen/Qwen3.5-2B
  dtype: bfloat16
  attn_implementation: null
  trust_remote_code: true

data:
  # v5 dataset path: directory containing per-placement subdirectories
  # (each with images/ + annotations.json). Multi-file load is auto-detected
  # when annotations_path is a directory.
  annotations_path: outputs/v5_3090x8_260429_092917/
  image_root: null
  # Pickle cache for the views list (keyed by placement range + score keys).
  # First run writes it; subsequent runs load in <1 s.
  views_cache_dir: outputs/v5_3090x8_260429_092917/_views_cache
  # Placement-level train/val split. Placements are sorted numerically by
  # the p{N}_* directory prefix; train uses [0, num_train), val uses
  # [num_train, num_train + num_val).
  num_train_placements: 300
  num_val_placements: 2      # was 20 — reduced to keep eval <15min
  action_frame: camera_local
  rotation_representation: orientation_6d
  target_score_keys:
    - occupancy
    - body_in_frame_ratio
    - cam_to_obj_azimuth_deg
    - cam_to_obj_elevation_deg
    - object_center_x
    - object_center_y
    - bbox_x_offset
    - bbox_y_offset
  distance_threshold: 3.0
  rotation_threshold_deg: null              # null = no rotation filter
  # adaptive: per-anchor N = min(candidates across bins); take exactly N
  # from every bin. Drops anchors with any empty bin. Gives perfectly
  # balanced per-bin pair counts at the cost of dropping ~44% of anchors.
  pair_distance_distribution: adaptive      # natural | uniform | log_uniform | adaptive
  n_distance_bins: 6
  min_pair_distance: 0.05                   # used by log_uniform only
  max_pairs_per_image: 20                   # ignored by adaptive mode
  zero_action_ratio: 0.1
  eval_ratio: 0.0                           # unused when num_train_placements > 0
  seed: 721

training:
  output_root: runs
  run_name: qwen35_vl_2b_1xh200_v5
  num_train_epochs: 1
  per_device_train_batch_size: 4
  per_device_eval_batch_size: 16   # was 4 — eval is forward-only, fits larger batch
  gradient_accumulation_steps: 2    # effective batch size = 4 × 2 = 8 (was 16)
  learning_rate: 2.0e-5
  weight_decay: 0.01
  warmup_ratio: 0.03
  max_length: 2048
  logging_steps: 50            # was 20; bumped to reduce TB clutter from new per-key/per-bucket scalars
  save_steps: 2000             # checkpoint every N steps (must be multiple of eval_steps when load_best_model_at_end=true)
  save_total_limit: 1          # +1 best (always preserved by HF) = best + last on disk
  eval_steps: 1000             # run eval every N steps
  load_best_model_at_end: true # track best ckpt by metric_for_best_model; final saved model is the best one
  metric_for_best_model: eval_loss
  greater_is_better: false
  dataloader_num_workers: 8
  gradient_checkpointing: false    # batch_size=4 fits without checkpointing
  bf16: true
  fp16: false
  deepspeed_config: null
  resume_from_checkpoint: null
