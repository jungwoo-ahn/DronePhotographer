run:
  run_root: runs
  run_name: vit_q_model
  save_every_steps: 200

data:
  data_root: outputs/DogWalk_260215_092109
  distance_threshold: 1.5
  batch_size: 128
  num_workers: 0
  image_size: 224
  pair_cache_path: null

train:
  max_steps: 50000
  lr: 1e-4
  device: auto

model:
  name: vit
  action_dim: 6
  num_outputs: 5
  vit:
    patch_size: 16
    embed_dim: 256
    depth: 4
    num_heads: 8
    mlp_dim: 512
    dropout: 0.0
